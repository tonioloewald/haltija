name: Docs Drift

# Fails if the generated docs (built from the API schema by `bun run build`)
# are out of date relative to what's committed. Keeps API.md / DOCS.md /
# llms.txt / hints.json / endpoints.json automatically in sync — a schema
# change that isn't accompanied by a rebuild trips this check.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docs-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Rebuild generated docs
        run: bun run build

      - name: Check every generated artifact is in sync
        run: |
          # No path list. The previous version named five files, all derived from api-schema.ts,
          # so it could not see the SIX generated-and-committed twins next to them —
          # bin/cli-commands.mjs, bin/window-state.mjs, bin/server-list.mjs, bin/project-origins.mjs,
          # bin/hints.mjs, apps/desktop/server-env.js — which are what npm actually ships
          # (package.json `files` includes bin and apps/desktop/*.js). unit-tests.yml builds BEFORE
          # it tests, so CI always exercises fresh output and structurally cannot notice a stale
          # committed twin; `bun test src/` alone does not build, so a local run tests the stale one.
          # That divergence presents as flake, which is the most expensive way to learn about it.
          #
          # A list can only ever omit the next generated file. The build leaves the tree clean, so
          # assert exactly that instead.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::'bun run build' changed committed files — a generated artifact is stale."
            echo "Run 'bun run build' locally and commit the result. Changed:"
            git status --porcelain
            echo ""
            git diff --stat
            exit 1
          fi
          echo "Every generated artifact is up to date."
