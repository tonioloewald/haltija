name: E2E (Playwright)

# Runs the self-contained Playwright suites (each spawns its own haltija
# server and injects the widget into a real Chromium page). Keeps the widget +
# REST behaviour honest — these went silently red once because nothing ran them.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (embeds the current widget the server serves)
        run: bun run build

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run E2E
        run: bun run test:e2e

      # Every Playwright suite spawns a haltija server. This lane had no footprint gate, which is
      # how its servers binding the real 8701 and writing ~/.haltija/certs went unnoticed.
      - name: Assert the suite left no footprint on the machine
        run: scripts/assert-no-machine-footprint.sh

  # The ONE suite whose answer differs by browser engine: whether an https page may reach
  # http://localhost (Chromium/Firefox yes, WebKit no — src/transports.ts). A Chromium-only
  # measurement once got this repo to declare the WebKit behaviour "false" in six places, so this
  # suite runs in all three engines. Separate job so the main e2e lane doesn't wait on two extra
  # browser downloads.
  engines:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (embeds the current widget the server serves)
        run: bun run build

      - name: Install Playwright Chromium, Firefox and WebKit
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Run the transport-fallback suite in all three engines
        run: bun run test:engines

      - name: Assert the suite left no footprint on the machine
        run: scripts/assert-no-machine-footprint.sh
