name: QA Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Install Electron dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64

      - name: Launch Electron app
        run: |
          cd apps/desktop
          npm install --omit=dev
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            npx electron . --no-sandbox > /tmp/electron-stdout.log 2> /tmp/electron-stderr.log &
          echo $! > /tmp/electron.pid
          sleep 2
          echo "--- Electron stdout ---"
          cat /tmp/electron-stdout.log || true
          echo "--- Electron stderr ---"
          cat /tmp/electron-stderr.log || true

      - name: Wait for server
        run: |
          echo "Waiting for Haltija server..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8700/status > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done
          if ! curl -sf http://localhost:8700/status; then
            echo "Server failed to start. Electron logs:"
            cat /tmp/electron-stdout.log || true
            cat /tmp/electron-stderr.log || true
            exit 1
          fi

      - name: Wait for browser connection
        run: |
          echo "Waiting for browser widget connection..."
          for i in $(seq 1 30); do
            WINDOWS=$(curl -sf http://localhost:8700/windows 2>/dev/null | jq '.windows | length' 2>/dev/null || echo 0)
            if [ "$WINDOWS" -gt 0 ]; then
              echo "Browser connected after ${i}s ($WINDOWS window(s))"
              break
            fi
            sleep 1
          done
          WINDOWS=$(curl -sf http://localhost:8700/windows | jq '.windows | length')
          if [ "$WINDOWS" -eq 0 ]; then
            echo "No browser connected"
            exit 1
          fi

      - name: Run playground tests
        run: |
          RESULT=$(curl -s -X POST http://localhost:8700/test/run \
            -H "Content-Type: application/json" \
            -d @tests/playground.json)
          echo "$RESULT" | jq . 2>/dev/null || echo "$RESULT"
          PASSED=$(echo "$RESULT" | jq '.passed' 2>/dev/null || echo "null")
          if [ "$PASSED" != "true" ]; then
            echo "::error::Playground tests failed"
            exit 1
          fi

      - name: Run homepage tests
        run: |
          RESULT=$(curl -s -X POST http://localhost:8700/test/run \
            -H "Content-Type: application/json" \
            -d @tests/homepage.json)
          echo "$RESULT" | jq . 2>/dev/null || echo "$RESULT"
          PASSED=$(echo "$RESULT" | jq '.passed' 2>/dev/null || echo "null")
          if [ "$PASSED" != "true" ]; then
            echo "::error::Homepage tests failed"
            exit 1
          fi

      - name: Run xinjs SPA tests (non-blocking)
        continue-on-error: true
        run: |
          RESULT=$(curl -s -X POST http://localhost:8700/test/run \
            -H "Content-Type: application/json" \
            --max-time 60 \
            -d @tests/xinjs-spa.json) || true
          echo "$RESULT" | jq . 2>/dev/null || echo "$RESULT"
          PASSED=$(echo "$RESULT" | jq '.passed' 2>/dev/null || echo "false")
          if [ "$PASSED" != "true" ]; then
            echo "::warning::xinjs SPA tests failed (external site, non-blocking)"
          fi

      # `--private --app` is the ONE advertised invocation with no automated coverage anywhere.
      # `src/launcher-smoke.test.ts` covers `--private --headless`, but it runs in the unit lane,
      # which has no display and must not grow an Electron dependency. This job already has Electron
      # and xvfb, so the check belongs here.
      #
      # It asserts the two properties that define private mode, both of which have broken before:
      #   1. it comes up at all (issue #17 shipped a launcher that died at module load in 19 tags)
      #   2. it does NOT touch the shared 8700 — the app running above on 8700 must still be there
      #      afterwards, which is the isolation guarantee stated in CLAUDE.md
      - name: '--private --app is isolated and self-terminating'
        run: |
          set -o pipefail
          # ELECTRON_DISABLE_SANDBOX because a GitHub runner has no correctly-configured SUID
          # sandbox helper: Electron dies with SIGTRAP before `app.whenReady()`, so the launcher
          # never prints HALTIJA_PRIVATE_READY and the poll below times out. The other Electron
          # step in this workflow passes `--no-sandbox` for the same reason, and the launcher sets
          # this itself under `--ci` — but `--private --app` is not `--ci`, so it got neither.
          # Without it this step could never reach a single assertion.
          # Xvfb started SEPARATELY rather than via `xvfb-run`, so the launcher is a direct child
          # and `$!` is genuinely its pid.
          #
          # This matters for the teardown assertion, not for the display. Private teardown works by
          # the Electron child polling HALTIJA_SPAWNER_PID — *the launcher's own pid* — because a
          # reparented child sees ppid 1 and cannot watch its parent that way. Under `xvfb-run`,
          # `$!` is the WRAPPER's pid; killing it leaves the launcher alive, its pid still valid,
          # and the private instance correctly keeps running. The first version of this step did
          # exactly that and then reported "private server outlived its launcher (orphan)" —
          # blaming haltija for the test harness killing the wrong process.
          Xvfb :99 -screen 0 1280x720x24 > /tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          export DISPLAY=:99
          sleep 2
          ELECTRON_DISABLE_SANDBOX=1 \
            node bin/tosijs-dev.mjs --private --app > /tmp/private-app.log 2>&1 &
          PRIV_PID=$!
          for i in $(seq 1 40); do
            grep -qE '^HALTIJA_PRIVATE_READY|HALTIJA_PRIVATE_READY \{' /tmp/private-app.log && break
            sleep 1
          done
          echo "--- private app log ---"; cat /tmp/private-app.log || true
          PRIV_PORT=$(grep -oE 'HALTIJA_PRIVATE_READY \{[^}]*\}' /tmp/private-app.log | head -1 | sed 's/.*"port":\([0-9]*\).*/\1/')
          if [ -z "$PRIV_PORT" ]; then
            echo "::error::--private --app never reported a port"
            exit 1
          fi
          echo "private port: $PRIV_PORT"
          # It must be a real, ephemeral instance — never the shared default.
          if [ "$PRIV_PORT" = "8700" ]; then
            echo "::error::--private took the SHARED port 8700"
            exit 1
          fi
          curl -sf "http://localhost:$PRIV_PORT/status" > /dev/null || {
            echo "::error::private server not reachable on its reported port"; exit 1; }
          # The shared instance from the earlier steps must be untouched — this is the whole point.
          curl -sf http://localhost:8700/status > /dev/null || {
            echo "::error::--private --app disturbed the SHARED server on 8700"; exit 1; }
          # And it must not outlive its launcher (issue #7).
          kill $PRIV_PID || true
          for i in $(seq 1 15); do
            curl -sf "http://localhost:$PRIV_PORT/status" > /dev/null 2>&1 || break
            sleep 1
          done
          if curl -sf "http://localhost:$PRIV_PORT/status" > /dev/null 2>&1; then
            echo "::error::private server outlived its launcher (orphan)"
            exit 1
          fi
          curl -sf http://localhost:8700/status > /dev/null || {
            echo "::error::shared server died during private teardown"; exit 1; }
          kill $XVFB_PID 2>/dev/null || true
          echo "private app: isolated, reachable, torn down; shared 8700 intact"

      - name: Capture failure snapshot
        if: failure()
        run: |
          curl -sf -X POST http://localhost:8700/snapshot \
            -H "Content-Type: application/json" \
            -d '{"trigger": "ci-failure", "context": "QA test suite failed"}' \
            > /tmp/failure-snapshot.json 2>/dev/null || true
          curl -sf http://localhost:8700/screenshot > /tmp/failure-screenshot.json 2>/dev/null || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-failure-snapshots
          path: /tmp/failure-*.json
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/electron.pid ]; then
            kill $(cat /tmp/electron.pid) 2>/dev/null || true
          fi
